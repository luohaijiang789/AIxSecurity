[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aixsecurity"
version = "0.1.0"
description = "Evidence-first AI-assisted white-box code auditing"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"

[project.scripts]
aixsecurity = "aixsecurity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
