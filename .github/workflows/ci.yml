name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/check_project.py
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: aixsecurity --help
      - run: cd /tmp && aixsecurity --version
      - run: cd /tmp && aixsecurity assets --database "$RUNNER_TEMP/asset-smoke.sqlite3" register --name "CI fixture" --repo https://example.com/org/service.git --request-id ci-001
      - run: cd /tmp && aixsecurity assets --database "$RUNNER_TEMP/asset-smoke.sqlite3" list
